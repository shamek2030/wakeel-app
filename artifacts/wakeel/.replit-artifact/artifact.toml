kind = "mobile"
previewPath = "/wakeel/"
title = "وكيل"
version = "1.0.0"
id = "artifacts/wakeel"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/wakeel/" ]
localPort = 21298

[services.development]
run = "pnpm --filter @workspace/wakeel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wakeel", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wakeel", "run", "serve" ]

[services.env]
PORT = "21298"
BASE_PATH = "/wakeel/"
